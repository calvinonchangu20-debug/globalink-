<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="orbit-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    
    <linearGradient id="chart-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Globe / Orbital Ring -->
  <ellipse cx="256" cy="256" rx="168" ry="168" fill="none" stroke="#334155" stroke-width="6"/>
  
  <!-- Dynamic Orbit ring (slanted) -->
  <ellipse cx="256" cy="256" rx="174" ry="66" fill="none" stroke="url(#orbit-cyan)" stroke-width="7" stroke-dasharray="130 25 60 20" transform="rotate(-28 256 256)" opacity="0.9"/>
  
  <!-- Global Longitude / Latitude trading curve -->
  <path d="M140 256 C 140 140, 372 140, 372 256 C 372 372, 140 372, 140 256 Z" fill="none" stroke="#475569" stroke-width="3.5" opacity="0.55"/>
  <path d="M256 92 C 195 170, 195 342, 256 420" fill="none" stroke="#475569" stroke-width="3" opacity="0.45"/>
  <path d="M256 92 C 317 170, 317 342, 256 420" fill="none" stroke="#475569" stroke-width="3" opacity="0.45"/>

  <!-- Candlesticks / Trading Bars in Background -->
  <!-- Candle 1 (Down) -->
  <line x1="184" y1="210" x2="184" y2="320" stroke="#f43f5e" stroke-width="4" opacity="0.8"/>
  <rect x="176" y="235" width="16" height="50" rx="3" fill="#f43f5e" opacity="0.9"/>

  <!-- Candle 2 (Up) -->
  <line x1="232" y1="180" x2="232" y2="300" stroke="#10b981" stroke-width="4" opacity="0.85"/>
  <rect x="224" y="200" width="16" height="70" rx="3" fill="#10b981" opacity="0.9"/>

  <!-- Candle 3 (Strong Up) -->
  <line x1="280" y1="140" x2="280" y2="270" stroke="#10b981" stroke-width="4" opacity="0.9"/>
  <rect x="272" y="160" width="16" height="85" rx="3" fill="#10b981"/>

  <!-- Dynamic Trending Up Arrow / Exponential Curve with Glow -->
  <path d="M120 350 C 170 340, 210 310, 260 220 C 300 150, 345 140, 385 130" 
        fill="none" 
        stroke="url(#chart-green)" 
        stroke-width="13" 
        stroke-linecap="round"
        filter="url(#neon-glow)"/>

  <!-- Precision Arrow Tip -->
  <path d="M348 122 L396 125 L382 172 Z" fill="#34d399" filter="url(#neon-glow)"/>

  <!-- Pulse / Target Node -->
  <circle cx="390" cy="130" r="7.5" fill="#ffffff" filter="url(#soft-glow)"/>
  <circle cx="390" cy="130" r="14" fill="none" stroke="#34d399" stroke-width="3.5" opacity="0.9"/>
  
  <!-- Digital Pulse Nodes -->
  <circle cx="260" cy="220" r="6" fill="#38bdf8"/>
  <circle cx="180" cy="330" r="5" fill="#38bdf8" opacity="0.9"/>
</svg>