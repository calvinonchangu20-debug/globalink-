<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="orbit-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    
    <linearGradient id="chart-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="link-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Logo Icon Group (Scaled to fit in 200x200 at x=20, y=10) -->
  <g transform="translate(20, 10) scale(0.35)">
    <!-- Outer Globe Ring -->
    <ellipse cx="256" cy="256" rx="168" ry="168" fill="none" stroke="#334155" stroke-width="7"/>
    
    <!-- Dynamic Orbit ring -->
    <ellipse cx="256" cy="256" rx="174" ry="66" fill="none" stroke="url(#orbit-cyan)" stroke-width="8" stroke-dasharray="130 25 60 20" transform="rotate(-28 256 256)" opacity="0.9"/>
    
    <!-- Globe Lines -->
    <path d="M140 256 C 140 140, 372 140, 372 256 C 372 372, 140 372, 140 256 Z" fill="none" stroke="#475569" stroke-width="4" opacity="0.5"/>
    <path d="M256 92 C 195 170, 195 342, 256 420" fill="none" stroke="#475569" stroke-width="3.5" opacity="0.4"/>
    <path d="M256 92 C 317 170, 317 342, 256 420" fill="none" stroke="#475569" stroke-width="3.5" opacity="0.4"/>

    <!-- Candlesticks -->
    <line x1="184" y1="210" x2="184" y2="320" stroke="#f43f5e" stroke-width="4.5" opacity="0.8"/>
    <rect x="176" y="235" width="16" height="50" rx="3" fill="#f43f5e" opacity="0.9"/>

    <line x1="232" y1="180" x2="232" y2="300" stroke="#10b981" stroke-width="4.5" opacity="0.85"/>
    <rect x="224" y="200" width="16" height="70" rx="3" fill="#10b981" opacity="0.9"/>

    <line x1="280" y1="140" x2="280" y2="270" stroke="#10b981" stroke-width="4.5" opacity="0.9"/>
    <rect x="272" y="160" width="16" height="85" rx="3" fill="#10b981"/>

    <!-- Trend Arrow -->
    <path d="M120 350 C 170 340, 210 310, 260 220 C 300 150, 345 140, 385 130" 
          fill="none" 
          stroke="url(#chart-green)" 
          stroke-width="14" 
          stroke-linecap="round"
          filter="url(#neon-glow)"/>
    <path d="M348 122 L396 125 L382 172 Z" fill="#34d399" filter="url(#neon-glow)"/>
    <circle cx="390" cy="130" r="8" fill="#ffffff"/>
    <circle cx="390" cy="130" r="15" fill="none" stroke="#34d399" stroke-width="3.5"/>
    <circle cx="260" cy="220" r="7" fill="#38bdf8"/>
    <circle cx="180" cy="330" r="6" fill="#38bdf8"/>
  </g>

  <!-- Typography -->
  <text x="215" y="112" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="64" fill="url(#text-grad)" letter-spacing="-1.5">GLOBAL</text>
  <text x="500" y="112" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="64" fill="url(#link-grad)" letter-spacing="-1.5">LINK</text>
  
  <rect x="218" y="132" width="530" height="1.5" fill="#334155" opacity="0.8"/>
  <text x="220" y="156" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="16" fill="#94a3b8" letter-spacing="4.5">NEXT-GEN SYNTHETIC TRADING PLATFORM</text>
</svg>